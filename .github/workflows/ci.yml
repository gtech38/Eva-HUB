name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-standards:
    name: PR standards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Title follows <ID>: summary or <type>(<scope>): summary"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^(WEB|ADM|WRK|DB|SHR|INF|DOC|LEG|EPIC)-[0-9]+: .+' || echo "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build|perf)(\([a-z0-9/_.-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be '<BACKLOG-ID>: summary' or '<type>(<scope>): summary' — got '$TITLE'"; exit 1
          fi
      - name: "Body references an issue (Closes/Refs #n)"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -Eiq '(closes|fixes|resolves|refs?|part of) #[0-9]+'; then echo ok; else
            echo "::error::PR body must reference an issue, e.g. 'Closes #12' or 'Refs #83'"; exit 1; fi
      - name: Checklist present
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -q 'How I verified' || { echo "::error::PR body must keep the 'How I verified' section from the template"; exit 1; }
      - name: "Branch flow: feature -> dev -> main"
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$BASE" in
            main)
              [ "$HEAD" = "dev" ] || { echo "::error::Only 'dev' may open a PR into main (promotion). Target 'dev' instead."; exit 1; }
              echo "$TITLE" | grep -Eq '^chore\(release\): ' || { echo "::error::Promotion PRs are titled 'chore(release): …'"; exit 1; } ;;
            dev)
              case "$HEAD" in main|dev) echo "::error::Open feature PRs from a ticket branch, not '$HEAD'."; exit 1 ;; esac ;;
            *) echo "::error::PRs must target 'dev' (features) or 'main' (promotion from dev)."; exit 1 ;;
          esac
          echo "ok: $HEAD -> $BASE"

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5433/hub
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: hub-media
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      AUTH_SECRET: ci-only-not-a-secret-0123456789
      ROOT_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate
        working-directory: packages/db
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (TypeScript)
        run: pnpm -r test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/media/pyproject.toml
      - name: Cache face models
        uses: actions/cache@v4
        with:
          path: workers/media/models
          key: face-models-yunet2023mar-sface2021dec
      - name: Python worker tests
        working-directory: workers/media
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/download_models.py
          python -m pytest -q

      - name: Claude hook tests
        run: python -m pytest -q -p no:cacheprovider .claude/hooks/tests

      - name: Backlog files parse
        run: |
          if [ -f scripts/backlog-sync.mjs ]; then node scripts/backlog-sync.mjs --check; else echo "no backlog script yet; skipping"; fi

