name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-standards:
    name: PR standards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: "Title follows <ID>: summary or <type>(<scope>): summary"
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if echo "$TITLE" | grep -Eq '^(WEB|ADM|WRK|DB|SHR|INF|DOC|LEG|EPIC)-[0-9]+: .+' || echo "$TITLE" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build|perf)(\([a-z0-9/_.-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be '<BACKLOG-ID>: summary' or '<type>(<scope>): summary' — got '$TITLE'"; exit 1
          fi
      - name: "Body references an issue (Closes/Refs #n)"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$BODY" | grep -Eiq '(closes|fixes|resolves|refs?|part of) #[0-9]+'; then echo ok; else
            echo "::error::PR body must reference an issue, e.g. 'Closes #12' or 'Refs #83'"; exit 1; fi
      - name: Checklist present
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "$BODY" | grep -q 'How I verified' || { echo "::error::PR body must keep the 'How I verified' section from the template"; exit 1; }

  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://hub:hub@localhost:5433/hub
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: hub-media
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci
      AUTH_SECRET: ci-only-not-a-secret-0123456789
      ROOT_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate
        working-directory: packages/db
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests (TypeScript)
        run: pnpm -r test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: workers/media/pyproject.toml
      - name: Python worker tests
        working-directory: workers/media
        run: |
          python -m pip install -q -e ".[dev]"
          python scripts/download_models.py
          python -m pytest -q

      - name: Backlog files parse
        run: node scripts/backlog-sync.mjs --dry-run >/dev/null
        env:
          GH_TOKEN: ${{ github.token }}
